# Eval set for python-cli-app blueprint.
# Each case is a build request — the agent should produce code matching the
# project's existing conventions + add a test + run lint.

defaults:
  must_have_test: true
  must_match_existing_runner: true

cases:
  - request: "Add a --version flag to the CLI that prints the package version."
    expected_files_changed: 2   # CLI module + test
    must_not_introduce_dep: true

  - request: "Add a new subcommand `list` that prints all available data sources."
    expected_files_changed: 2
    must_not_introduce_dep: true

  - request: "Add error handling for the case where the input file doesn't exist."
    expected_files_changed: 2
    must_match_existing_test_runner: true
