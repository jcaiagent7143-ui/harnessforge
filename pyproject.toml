[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
# harnessforge — the universal harness layer for AI coding agents.
# One command bootstraps a project so Claude Code, Cursor, Codex,
# Gemini CLI, Aider, OpenHarness, and any other coding agent can
# work in it productively.
#
#   pipx install harnessforge && harness init
#   # or, no install:
#   uvx harnessforge init
#
# The `aegis` Python module ships in the same wheel as the internal
# LLM I/O + sandbox + cache layer that `harness verify` uses.
name = "harnessforge"
version = "0.2.1"
description = "Universal harness layer for AI coding agents — one command sets up your repo for any agent (Claude Code, Cursor, Codex, Gemini CLI, Aider, OpenHarness)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "The harnessforge Contributors" },
]
keywords = [
  "ai", "agent", "llm", "claude", "openai", "harness",
  "agents-md", "skills", "mcp", "cursor", "claude-code", "codex",
  "gemini-cli", "aider", "openharness", "rag", "agent-blueprint",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "jinja2>=3.1",
  "rich>=13.7",
  "typer>=0.12",
  "anyio>=4.3",
  # harness.profile / .skills_io / .blueprints.loader / .catalog / .cli.inspect
  # all import yaml. Was implicit via dev extras — caught by v0.2.1 fresh-venv
  # smoke test (broke every `pip install harnessforge` install).
  "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
ollama = ["ollama>=0.3"]
litellm = ["litellm>=1.40"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
proxy = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp>=1.0"]
tui = ["textual>=0.60"]
embeddings = ["numpy>=1.26"]
all = [
  "anthropic>=0.40",
  "openai>=1.40",
  "google-genai>=0.3",
  "ollama>=0.3",
  "litellm>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "mcp>=1.0",
  "textual>=0.60",
  "numpy>=1.26",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "vcrpy>=6.0",
  "respx>=0.21",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/jcaiagent7143-ui/harnessforge"
Documentation = "https://jcaiagent7143-ui.github.io/harnessforge"
Repository = "https://github.com/jcaiagent7143-ui/harnessforge"
Issues = "https://github.com/jcaiagent7143-ui/harnessforge/issues"
Changelog = "https://github.com/jcaiagent7143-ui/harnessforge/blob/main/CHANGELOG.md"

[project.scripts]
# Primary CLI — matches the PyPI distribution name so `uvx harnessforge init` works
# without `--from`. Same entry point as the short `harness` alias below.
harnessforge = "harness.cli.__main__:main"
# Short alias — easier to type in a shell session; same entry point.
harness = "harness.cli.__main__:main"
# Back-compat: aegis remains importable + runnable, but the headline
# project is now harnessforge. Marked legacy in `aegis --help`.
aegis = "aegis.cli.__main__:app"

[tool.hatch.build.targets.wheel]
# Ship both packages from the same wheel.
packages = ["src/harness", "src/aegis"]

[tool.hatch.build.targets.sdist]
include = [
  "src/harness",
  "src/aegis",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle, pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "SIM",              # simplify
  "RUF",              # ruff-specific
]
ignore = ["E501"]    # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"examples/**" = ["E402"]
# Typer requires `typer.Option(...)` in default values — that's the API.
"src/aegis/cli/**" = ["B008"]
"src/harness/cli/**" = ["B008"]
# StrEnum is Python 3.11+; we already require it, but the inheritance pattern
# is explicit and clearer for non-3.11 readers.
"src/aegis/core/risk.py" = ["UP042"]
# Scripts use Unicode for terminal output (boxes, multiplication signs)
"scripts/**" = ["RUF001", "RUF002", "RUF003"]
"docs/**" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["harness", "aegis"]
# Blueprint validator modules + Jinja2 templates are loaded dynamically
# (importlib.util.spec_from_file_location) and intentionally share filenames
# across blueprints (e.g. every blueprint has its own check_structure.py).
# That's not a Python-import collision at runtime, but mypy doesn't see the
# dynamic load — exclude.
exclude = [
  '^src/harness/blueprints/[^/]+/validators/',
  '^src/harness/blueprints/[^/]+/files/',
]

[[tool.mypy.overrides]]
module = [
  "anthropic.*", "openai.*", "google.*", "ollama.*", "litellm.*",
  "vcr.*", "textual.*", "mcp.*", "fastapi.*", "uvicorn.*",
]
ignore_missing_imports = true

# MCP server uses @server.list_tools() / @server.call_tool() decorators from
# the mcp SDK which are not typed — silently disable decorator type-checking
# here rather than turning off strict globally.
[[tool.mypy.overrides]]
module = ["aegis.mcp.server", "harness.mcp.server"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

# Benchmarks are a CLI/research surface, not the public API — relax strict.
[[tool.mypy.overrides]]
module = ["benchmarks.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "live: tests that hit real LLM APIs (require RUN_LIVE_TESTS=1)",
  "integration: tests using recorded LLM cassettes",
]

[tool.coverage.run]
source = ["src/harness", "src/aegis"]
omit = [
  "src/aegis/web/*",
  "src/aegis/cli/*",
  "src/harness/cli/*",
  "src/harness/mcp/*",
  # Jinja2 templates rendered into the user's repo — not part of the
  # importable Python surface. Coverage spots .py.j2 because of the .py
  # suffix; explicitly omit them.
  "**/*.j2",
  "src/harness/blueprints/*/files/**",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
