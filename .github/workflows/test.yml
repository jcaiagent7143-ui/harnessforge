name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Aegis suite imports: openai (provider), mcp (mcp test), fastapi (proxy + web tests).
          # Harness suite: needs the package installed (pyproject) + dev tooling.
          pip install -e ".[dev,proxy,mcp,openai]"

      - name: Aegis unit tests
        run: pytest tests/unit -v --cov=src/aegis --cov-report=term

      - name: Harness unit + interop + golden tests
        run: pytest tests/harness/unit tests/harness/interop tests/harness/golden -v

      - name: Harness CLI integration tests
        run: pytest tests/harness/integration -v
        env:
          PATH: ${{ env.pythonLocation }}/bin:${{ env.PATH }}

      - name: Coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pytest tests/harness tests/unit --cov=src/harness --cov=src/aegis --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
