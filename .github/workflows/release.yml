name: release

# Triggered on a version tag (e.g. harnessforge-v0.2.1 OR v0.2.1) — builds
# + publishes to PyPI using OIDC Trusted Publishing (no API token in
# GitHub secrets).
#
# ONE-TIME PYPI SETUP (do this before pushing the first tag):
#
#   1. Sign in at https://pypi.org/manage/account/publishing/
#   2. Click "Add a new pending publisher"
#   3. Fill in:
#        PyPI project name: harnessforge
#        Owner:              jcaiagent7143-ui
#        Repository name:    harnessforge
#        Workflow name:      release.yml
#        Environment name:   pypi
#   4. Save.
#
# ONE-TIME GITHUB SETUP:
#
#   1. Repo Settings → Environments → New environment → name: "pypi"
#   2. (Optional) add "Required reviewers" so a human approves each release.
#
# Then tag + push:
#
#   git tag harnessforge-v0.2.1
#   git push origin harnessforge-v0.2.1
#
# This workflow fires on tag push, builds sdist+wheel, uploads to PyPI
# via OIDC, then creates a GitHub Release with the CHANGELOG section.

on:
  push:
    tags:
      - "v*"
      - "harnessforge-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/harnessforge/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # Accept either v0.2.1 or harnessforge-v0.2.1
          version="${tag#v}"
          version="${version#harnessforge-v}"
          # Extract the section for this version from CHANGELOG.md.
          # Header shape: "## [harnessforge X.Y.Z] — date — title"
          awk -v v="$version" '
            $0 ~ "^## \\[harnessforge "v"\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${tag}" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
